site_name: DocsForge Example
site_url: https://docsforge.dev
repo_url: https://github.com/qq/docsforge
repo_name: qq/docsforge

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/qq/docsforge

# NOTE: No 'plugins:' section is required.
# DocsForge auto-registers Material plugins:
#   - search (enhanced search)
#   - tags   (tag index pages)
#   - blog   (if mkdocs-blog-plugin is installed)
#   - privacy (if mkdocs-privacy-plugin is installed)
#   - social  (if mkdocs-social-plugin is installed)
#
# If you define 'plugins:' yourself, DocsForge merges rather than overwrites.
