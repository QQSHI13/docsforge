<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--vscode-font-family);
  font-size: var(--vscode-font-size);
  color: var(--vscode-foreground);
  background: transparent;
  padding: 8px;
}
.search-container {
  display: flex;
  align-items: center;
  background: var(--vscode-input-background);
  border: 1px solid var(--vscode-input-border);
  border-radius: 4px;
  padding: 4px 8px;
  margin-bottom: 8px;
}
.search-container:focus-within { border-color: var(--vscode-focusBorder); }
.search-container .icon {
  color: var(--vscode-input-placeholderForeground);
  margin-right: 6px;
  font-size: 14px;
}
.search-container input {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--vscode-input-foreground);
  outline: none;
  font-size: var(--vscode-font-size);
}
.search-container input::placeholder { color: var(--vscode-input-placeholderForeground); }
.results { margin-bottom: 8px; }
.result-item {
  padding: 6px 8px;
  cursor: pointer;
  border-radius: 3px;
  margin-bottom: 2px;
}
.result-item:hover { background: var(--vscode-list-hoverBackground); }
.result-title {
  font-weight: 600;
  font-size: calc(var(--vscode-font-size) + 1px);
  color: var(--vscode-textLink-foreground);
  margin-bottom: 2px;
}
.result-path {
  font-size: calc(var(--vscode-font-size) - 1px);
  color: var(--vscode-descriptionForeground);
  margin-bottom: 2px;
}
.result-snippet {
  font-size: calc(var(--vscode-font-size) - 1px);
  color: var(--vscode-foreground);
  opacity: 0.8;
  line-height: 1.3;
}
.no-results {
  color: var(--vscode-descriptionForeground);
  padding: 8px;
  text-align: center;
  font-style: italic;
}
.actions { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.action-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border: none;
  border-radius: 4px;
  background: var(--vscode-button-secondaryBackground);
  color: var(--vscode-button-secondaryForeground);
  cursor: pointer;
  font-size: var(--vscode-font-size);
  text-align: left;
  width: 100%;
}
.action-btn:hover { background: var(--vscode-button-secondaryHoverBackground); }
.action-btn .codicon { font-size: 16px; width: 20px; text-align: center; }
.action-btn.hidden { display: none; }
.separator { border: none; border-top: 1px solid var(--vscode-panel-border); margin: 8px 0; }
</style>
</head>
<body>
  <div class="search-container">
    <span class="icon">&#128269;</span>
    <input type="text" id="searchInput" placeholder="Search docs..." autocomplete="off">
  </div>
  <div id="results" class="results"></div>
  <hr class="separator">
  <div class="actions" id="actions">
    <button class="action-btn" data-cmd="docsforge.serve" id="btnStart">
      <span class="codicon">&#9654;</span> Start Server
    </button>
    <button class="action-btn" data-cmd="docsforge.stop" id="btnStop">
      <span class="codicon">&#9632;</span> Stop Server
    </button>
    <button class="action-btn" data-cmd="docsforge.build" id="btnBuild">
      <span class="codicon">&#9881;</span> Build
    </button>
    <button class="action-btn" data-cmd="docsforge.stopBuild" id="btnStopBuild">
      <span class="codicon">&#9632;</span> Stop Build
    </button>
    <button class="action-btn" data-cmd="docsforge.openServer" id="btnPreview">
      <span class="codicon">&#127760;</span> Open Preview
    </button>
    <button class="action-btn" data-cmd="docsforge.init">
      <span class="codicon">&#128193;</span> Initialize Project
    </button>
    <button class="action-btn" data-cmd="docsforge.openDocs">
      <span class="codicon">&#128214;</span> Open Docs
    </button>
  </div>
<script>
(function() {
  const vscode = acquireVsCodeApi();
  let searchTimer;

  document.getElementById('searchInput').addEventListener('input', function() {
    clearTimeout(searchTimer);
    const q = this.value;
    searchTimer = setTimeout(function() {
      vscode.postMessage({ type: 'search', query: q });
    }, 200);
  });

  window.addEventListener('message', function(event) {
    const msg = event.data;
    if (msg.type === 'state') {
      document.getElementById('btnStart').classList.toggle('hidden', msg.serverRunning);
      document.getElementById('btnStop').classList.toggle('hidden', !msg.serverRunning);
      document.getElementById('btnBuild').classList.toggle('hidden', msg.buildRunning);
      document.getElementById('btnStopBuild').classList.toggle('hidden', !msg.buildRunning);
      document.getElementById('btnPreview').classList.toggle('hidden', !msg.serverRunning);
    } else if (msg.type === 'searchResults') {
      var container = document.getElementById('results');
      if (msg.results.length === 0) {
        var q = document.getElementById('searchInput').value.trim();
        container.innerHTML = q ? '<div class="no-results">No matching pages</div>' : '';
        return;
      }
      var html = '';
      for (var i = 0; i < msg.results.length; i++) {
        var r = msg.results[i];
        html += '<div class="result-item" data-path="' + r.path + '">'
          + '<div class="result-title">' + esc(r.title) + '</div>'
          + '<div class="result-path">' + esc(r.path) + '</div>'
          + '<div class="result-snippet">' + esc(r.snippet) + '</div>'
          + '</div>';
      }
      container.innerHTML = html;
      container.querySelectorAll('.result-item').forEach(function(el) {
        el.addEventListener('click', function() {
          vscode.postMessage({ type: 'openFile', path: this.dataset.path });
        });
      });
    }
  });

  document.querySelectorAll('.action-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      vscode.postMessage({ type: 'command', command: this.dataset.cmd });
    });
  });

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  vscode.postMessage({ type: 'ready' });
})();
</script>
</body>
</html>
