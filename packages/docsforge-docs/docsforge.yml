site_name: DocsForge
site_url: https://qqshi13.github.io/docsforge/
site_author: QQ
site_description: >-
  Self-contained documentation engine.
  pip install docsforge, write Markdown, done.

repo_name: QQSHI13/docsforge
repo_url: https://github.com/QQSHI13/docsforge
edit_uri: edit/main/packages/docsforge-docs/docs/

copyright: Copyright &copy; 2025–2026 QQ

theme:
  name: material
  features:
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  favicon: assets/images/favicon.png
  logo: assets/logo.svg

plugins:
  - material/i18n:
      languages:
        - locale: en
          name: English
          default: true
        - locale: zh
          name: 中文
          nav_translations:
            Home: 首页
            "Getting started": 入门
            Setup: 设置
            Reference: 参考
            Troubleshooting: 故障排除

nav:
  - Home: index.md
  - Getting started:
    - Installation: getting-started.md
    - Migrating from MkDocs: getting-started/migrating-from-mkdocs.md
    - Creating your site: creating-your-site.md
    - Publishing:
      - publishing-your-site.md
      - publishing/index.md
      - Usage Guide: publishing/usage.md
      - Migration Guide: publishing/migration.md
      - Deployment Guide: publishing/deployment-guide.md
    - Visual Studio Code: vscode-extension.md
    - Features: features.md
    - Philosophy: philosophy.md
    - License: license.md
    - Changelog:
      - changelog/index.md
  - Setup:
    - setup/index.md
    - PDF Export: setup/pdf-export.md
    - Changing the colors: setup/changing-the-colors.md
    - Changing the fonts: setup/changing-the-fonts.md
    - Changing the language: setup/changing-the-language.md
    - Multi-language sites: setup/i18n.md
    - Setting up navigation: setup/setting-up-navigation.md
    - Setting up site search: setup/setting-up-site-search.md
    - Setting up site analytics: setup/setting-up-site-analytics.md
    - Building an optimized site: setup/building-an-optimized-site.md
    - Adding a git repository: setup/adding-a-git-repository.md
    - Setting up social cards: setup/setting-up-social-cards.md
    - Setting up a blog: blogging.md
  - Reference:
    - reference/index.md
    - Configuration: reference/configuration.md
    - Admonitions: reference/admonitions.md
    - Annotations: reference/annotations.md
    - Code blocks: reference/code-blocks.md
    - Content tabs: reference/content-tabs.md
    - Data tables: reference/data-tables.md
    - Diagrams: reference/diagrams.md
    - Formatting: reference/formatting.md
    - Icons & Emojis: reference/icons-emojis.md
    - Images: reference/images.md
    - Lists: reference/lists.md
    - Tooltips: reference/tooltips.md
  - Advanced:
    - Customization: advanced/customization.md
    - Custom Plugins: advanced/plugins.md
    - Plugin Development: advanced/plugin-development.md
    - Docker: advanced/docker.md
  - Troubleshooting: troubleshooting.md
