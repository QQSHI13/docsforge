site_name: DocsForge
site_url: https://docsforge.io/
site_author: QQSHI13
site_description: A self-contained documentation engine forked from MkDocs + Material

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/book-open-variant

plugins:
  - search
  - tags
  - blog:
      blog_dir: blog
      blog_toc: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/QQSHI13/docsforge

copyright: "DocsForge is licensed under MIT"

nav:
  - Home: index.md
  - Features:
    - features/index.md
    - Self-Contained: features/self-contained.md
    - Plugins: features/plugins.md
    - Themes: features/themes.md
  - Blog:
    - blog/index.md
    - Archive: blog/archive.md
  - Changelog: changelog.md
