[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docsforge"
description = "Self-contained unified documentation engine with Material theme."
readme = "README.md"
license = "LGPL-3.0-or-later"
authors = [{name = "DocsForge Contributors"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Text Processing",
]
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "click >=7.0",
    "Jinja2 >=2.11.1",
    "markupsafe >=2.0.1",
    "Markdown >=3.3.6",
    "PyYAML >=5.1",
    "watchdog >=2.0",
    "ghp-import >=1.0",
    "mergedeep >=1.3.4",
    "pyyaml_env_tag >=0.1",
    "packaging >=20.5",
    "pathspec >=0.11.1",
    "platformdirs >=2.2.0",
    "colorama >=0.4",
    "pymdown-extensions >=10.0",
    "backrefs >=5.0",
    "paginate >=0.5",
    "requests >=2.27",
    "babel >=2.9.0",
    "pygments >=2.16",
    "lunr >=0.7",
]

[project.optional-dependencies]
imaging = ["pillow>=10.2", "cairosvg>=2.6"]

[project.urls]
Documentation = "https://qqshi13.github.io/docsforge-docs"
Source = "https://github.com/QQSHI13/docsforge"
Issues = "https://github.com/QQSHI13/docsforge/issues"

[project.scripts]
docsforge = "docsforge.__main__:cli"

# All entrypoints point to docsforge internals
[project.entry-points."docsforge.plugins"]
"material/blog" = "docsforge.plugins.blog.plugin:BlogPlugin"
"material/info" = "docsforge.plugins.info.plugin:InfoPlugin"
"material/meta" = "docsforge.plugins.meta.plugin:MetaPlugin"
"material/privacy" = "docsforge.plugins.privacy.plugin:PrivacyPlugin"
"material/search" = "docsforge.plugins.search.plugin:SearchPlugin"
"material/tags" = "docsforge.plugins.tags.plugin:TagsPlugin"
"material/minify" = "docsforge.plugins.minify.plugin:MinifyPlugin"

[project.entry-points."docsforge.themes"]
material = "docsforge.themes.material.templates"

[tool.hatch.version]
path = "docsforge/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/docsforge", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
include = ["/docsforge"]
# Include .icons/ even if historically gitignored
artifacts = ["/docsforge/themes/material/templates/.icons/**"]
