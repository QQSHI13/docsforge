[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docsforge"
description = "Drop-in replacement for MkDocs and Material for MkDocs. Self-contained documentation engine with vendored theme, plugins, KaTeX math, offline search, and zero external dependencies."
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "DocsForge Contributors"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Text Processing",
]
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "click >=8.4.2",
    "Jinja2 >=3.1.6",
    "markupsafe >=3.0.3",
    "Markdown >=3.10.3",
    "PyYAML >=6.0.3",
    "watchdog >=6.0.0",
    "mergedeep >=1.3.4",
    "pyyaml_env_tag >=1.1",
    "packaging >=26.3",
    "pathspec >=1.1.1",
    "platformdirs >=4.11.2",
    "colorama >=0.4.6",
    "pymdown-extensions >=11.0.1",
    "backrefs >=8.0",
    "requests >=2.34.2",
    "babel >=2.18.0",
    "pygments >=2.20.0",
    "lunr >=0.8.0",
    "csscompress >=0.1.0",
    "min-html >=0.18.4",
    "min-js >=3.0.2",
]

[project.optional-dependencies]
chinese = ["jieba>=0.42.1"]
all = ["playwright>=1.62.0", "jieba>=0.42.1", "docsforge[pdf]", "docsforge[social]"]
pdf = ["playwright>=1.62.0", "pypdf>=6.15.0"]
social = ["pillow>=12.3.0", "cairosvg>=2.9.0"]

[project.urls]
Documentation = "https://qqshi13.github.io/docsforge"
Source = "https://github.com/QQSHI13/docsforge"
Issues = "https://github.com/QQSHI13/docsforge/issues"

[project.scripts]
docsforge = "docsforge.__main__:cli"

# All entrypoints point to docsforge internals
[project.entry-points."docsforge.plugins"]
"material/blog" = "docsforge.core.blog:BlogPlugin"
"material/i18n" = "docsforge.core.i18n:I18nPlugin"
"material/info" = "docsforge.core.info:InfoPlugin"
"material/meta" = "docsforge.core.meta:MetaPlugin"
"material/privacy" = "docsforge.core.privacy:PrivacyPlugin"
"material/search" = "docsforge.core.search:SearchPlugin"
"material/tags" = "docsforge.core.tags:TagsPlugin"
"material/minify" = "docsforge.core.minify:MinifyPlugin"
"material/social" = "docsforge.core.social:SocialPlugin"

[project.entry-points."docsforge.themes"]
material = "docsforge.templates"

[tool.hatch.version]
path = "docsforge/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/docsforge", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
include = ["/docsforge"]
# Include .icons/ even if historically gitignored
artifacts = ["/docsforge/templates/.icons/**"]
