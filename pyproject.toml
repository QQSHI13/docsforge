[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docsforge"
description = "Candidate drop-in replacement for MkDocs + Material for MkDocs. Self-contained documentation engine with vendored theme, plugins, KaTeX math, offline search, and zero external dependencies. If migration breaks anything, we fix it for free."
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "DocsForge Contributors"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Documentation",
    "Topic :: Text Processing",
]
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "click >=8.5.0",
    "Jinja2 >=3.1.6",
    "markupsafe >=3.0.4",
    "Markdown >=3.11.2",
    "PyYAML >=6.0.3",
    "watchdog >=6.0.0",
    "mergedeep >=1.3.4",
    "pyyaml_env_tag >=1.1",
    "packaging >=26.3",
    "pathspec >=1.1.1",
    "platformdirs >=4.13.6",
    "colorama >=0.4.6",
    "pymdown-extensions >=12.3",
    "backrefs >=8.1",
    "requests >=2.34.2",
    "babel >=2.18.0",
    "pygments >=2.21.0",
    # libxml2 binding, used by the asset optimizer to scan built HTML for asset
    # references — the single largest cost in a cold build (libxml2 is ~3.7x
    # faster than html.parser there). Ships manylinux/musllinux/macOS/Windows
    # wheels for every supported CPython, so no build step is needed.
    "lxml >=6.0.2",
    "marz-search >=0.3.1",
    # minify-go ships per-interpreter wheels (cp310..cp314) with no sdist and
    # no abi3 build, so it cannot be installed on 3.15 yet. The minify plugin
    # degrades to serving unminified output when the backend is missing, which
    # is far better than an unsatisfiable install on a supported interpreter.
    # Drop the marker once upstream publishes a cp315 wheel (or an abi3 one).
    "minify-go >=2.24.24; python_version < '3.15'",
]

[project.optional-dependencies]
# Transitional no-op: Marz handles CJK natively, jieba is no longer used.
chinese = []
all = ["playwright>=1.64.1", "docsforge[pdf]", "docsforge[social]"]
pdf = ["playwright>=1.64.1", "pypdf>=6.21.2"]
social = ["pillow>=13.0.0", "cairosvg>=2.9.1"]
# Pinned to the version CI enforces, so `ruff check` locally matches the gate.
dev = ["pytest>=9.1.1", "pytest-mock>=3.17.0", "ruff==0.17.3"]

[project.urls]
Documentation = "https://qqshi13.github.io/docsforge"
Source = "https://github.com/QQSHI13/docsforge"
Issues = "https://github.com/QQSHI13/docsforge/issues"

[project.scripts]
docsforge = "docsforge.__main__:cli"

# All entrypoints point to docsforge internals
[project.entry-points."docsforge.plugins"]
"material/blog" = "docsforge.core.blog:BlogPlugin"
"material/i18n" = "docsforge.core.i18n:I18nPlugin"
"material/info" = "docsforge.core.info:InfoPlugin"
"material/meta" = "docsforge.core.meta:MetaPlugin"
"material/privacy" = "docsforge.core.privacy:PrivacyPlugin"
"material/search" = "docsforge.core.search:SearchPlugin"
"material/tags" = "docsforge.core.tags:TagsPlugin"
"material/minify" = "docsforge.core.minify:MinifyPlugin"
"material/social" = "docsforge.core.social:SocialPlugin"

[project.entry-points."docsforge.themes"]
material = "docsforge.templates"

[tool.hatch.version]
path = "docsforge/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/docsforge", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
include = ["/docsforge"]
# Include .icons/ even if historically gitignored
artifacts = ["/docsforge/templates/.icons/**"]

[tool.ruff]
# Match requires-python. py311 lets the gate drop 3.10-only workarounds and
# still flags anything newer than the floor (e.g. 3.12+ syntax) as a bug.
target-version = "py311"
line-length = 120
extend-exclude = [
    # Generated or third-party trees, not authored here.
    "docsforge/templates",
    "node_modules",
    "site",
    "studio",
]

[tool.ruff.lint]
# A correctness *and* style gate. DocsForge no longer tracks upstream
# ProperDocs / Material for MkDocs, so there is no reason to preserve upstream
# formatting; the tree is held to one consistent house style instead.
#
# Correctness:
#   F     pyflakes           - undefined names, unused imports/variables
#   B     flake8-bugbear     - mutable defaults, unbound loop vars, bad zip
#   PL    pylint             - errors + warnings + the cheap conventions
#   RUF   ruff-specific      - mutable class defaults, ambiguous unicode, ...
#   DTZ   flake8-datetimez   - naive datetimes
#   LOG   flake8-logging     - logger misuse
# Style:
#   E, W  pycodestyle        - whitespace, line length, statement layout
#   I     isort              - import order
#   N     pep8-naming        - names
#   Q     flake8-quotes      - double quotes (already 78% of the tree)
#   UP    pyupgrade          - modern syntax for the supported Python range
#   C4    comprehensions     - dict()/list() calls, redundant comprehensions
#   SIM   flake8-simplify    - collapsible branches, contextlib.suppress
#   RET   flake8-return      - superfluous else/return
#   ISC   implicit-str-concat
#   PIE   flake8-pie
#   ICN   import-conventions - the conventional aliases
#   FURB  refurb             - modern idiom nits
#   PERF  perflint           - obviously wasteful loops
#   PGH   pygrep-hooks       - blanket `# type: ignore`
#   TID   tidy-imports       - no relative imports beyond the parent
select = [
    "F", "B", "PL", "RUF", "DTZ", "LOG",
    "E", "W", "I", "N", "Q", "UP", "C4", "SIM", "RET",
    "ISC", "PIE", "ICN", "FURB", "PERF", "PGH", "TID",
]
ignore = [
    # Deferring `raise ... from err` across the tree would touch ~23 call sites
    # and change traceback output users may match on.
    "B904",
    # Lazy imports are load-bearing here: the CLI keeps startup fast by not
    # importing jinja/markdown/pygments until a command actually needs them,
    # and several modules import inside functions to break import cycles.
    "PLC0415",
    # "Too many x" — these measure size, not correctness, and firing them would
    # demand restructuring long-but-linear functions (build orchestration,
    # config validation) into artificial helpers.
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
    # Magic values: comparisons against HTTP codes, byte sizes and version
    # tuples read better inline than behind a named constant.
    "PLR2004",
    # `import xml.etree.ElementTree as etree` is the naming the Markdown
    # extension API itself uses; matching it keeps extension code readable.
    # (N813 is the name check, ICN001 the "should be `ET`" convention check.)
    "N813", "ICN001",
    # try/except inside a loop is the correct shape when each iteration must
    # survive its own failure (per-page render, per-option validation).
    "PERF203",
    # Ambiguous-unicode: DocsForge renders prose. En dashes, ℹ and friends are
    # deliberate typography in user-facing strings, not homoglyph smuggling.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Vendored 'paginate' 0.5.7, kept close to upstream (see the module docstring)
# because it is a dead dependency we absorbed rather than code we maintain.
"docsforge/paginate.py" = ["E402", "N", "RET", "SIM", "UP", "C4", "FURB", "PLW", "PERF"]
# Names fixed by the Markdown extension API (`makeExtension`,
# `extendMarkdown`) and by the decorator-as-lowercase-class convention.
"docsforge/preview.py" = ["N802"]
"docsforge/utils.py" = ["N801"]
# The name deliberately mirrors the stdlib `ExceptionGroup` it stands in for.
"docsforge/exceptions.py" = ["N818"]
# `ParseResult as URL` reads as a type name throughout the privacy plugin,
# which annotates dozens of parameters with it.
"docsforge/core/privacy.py" = ["N814"]
# Tests: asserting on a regression's historical name is more useful than
# conforming to snake_case.
"tests/regression/test_regressions.py" = ["N802"]
# Blog post dates are naive by design (a post is dated, not instantaneous);
# the fixtures must construct them the same way the config option does.
"tests/unit/plugins/test_blog.py" = ["DTZ"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

