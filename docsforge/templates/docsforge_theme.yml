# Language for theme localization
language: en

# Text direction (can be ltr or rtl), default: ltr
direction:

# Feature flags for functionality that alters behavior significantly, and thus
# may be a matter of taste. DocsForge enables a rich set of defaults to
# maximize the out-of-the-box experience.
features:
  # Content
  - content.action.edit
  - content.action.view
  - content.code.annotate
  - content.code.copy
  - content.tooltips
  # Navigation
  - navigation.footer
  - navigation.indexes
  - navigation.sections
  - navigation.tabs
  - navigation.top
  - navigation.tracking
  - navigation.instant
  - navigation.instant.progress
  # Search
  - search.highlight
  - search.share
  - search.suggest
  # TOC
  - toc.follow

# Fonts used by Material, automatically loaded from Google Fonts - see the site
# for a list of available fonts
font:

  # Default font for text
  text: Roboto

  # Fixed-width font for code listings
  code: Roboto Mono

# From Material 5.x on, icons are inlined into the HTML and CSS as SVGs.
# Icons that are part of the HTML can be configured and replaced
icon:

# Color palette
palette:
  - scheme: default
    primary: indigo
    accent: indigo

# Favicon to be rendered
favicon: assets/images/favicon.png

# Static pages to build
static_templates:
  - 404.html
