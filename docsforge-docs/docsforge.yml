site_name: DocsForge
site_url: https://qqshi13.github.io/docsforge/
site_author: QQ
site_description: >-
  Self-contained documentation engine.
  pip install docsforge, write Markdown, done.

repo_name: QQSHI13/docsforge
repo_url: https://github.com/QQSHI13/docsforge
edit_uri: edit/main/docsforge-docs/docs/

copyright: Copyright © 2025–2026 QQ

# Social cards are opt-in (requires pillow + cairosvg). The other core
# plugins (search, tags, blog, meta, info, minify, privacy, i18n) load
# automatically and don't need to be declared.
plugins:
  - social

theme:
  name: material
  features:
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: palette.toggle.dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-4
        name: palette.toggle.light
  font:
    text: Roboto
    code: Roboto Mono
  favicon: assets/images/favicon.png
  logo: assets/logo.svg

extra:
  i18n_languages:
    - locale: en
      name: English
      default: true
    - locale: zh
      name: 中文
      nav_translations:
        Home: 首页
        "Getting started": 入门
        Setup: 设置
        Reference: 参考
        Troubleshooting: 故障排除

