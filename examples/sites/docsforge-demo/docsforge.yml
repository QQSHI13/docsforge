site_name: DocsForge Demo
site_url: https://docsforge-demo.pages.dev/
site_description: Documentation for DocsForge Demo
site_author: QQ

theme:
  name: material
  custom_dir: overrides
  favicon: images/favicon.png
  logo: images/docsforge.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - content.code.copy
    - content.action.edit

repo_url: https://github.com/QQSHI13/docsforge
repo_name: QQSHI13/docsforge
edit_uri: edit/main/examples/sites/docsforge-demo/docs/

# search, tags, blog, and privacy are built-in core plugins and load
# automatically — no need to declare them under `plugins:`.
# social is opt-in: it needs pillow + cairosvg.
plugins:
  - social
nav:
  - title: Home
    path: index.md
  - title: Diagram Demo
    path: diagram-demo.md
  - title: Features
    path: features.md
  - title: LaTeX Equations
    path: latex-equations.md
  - title: Theme Playground
    path: theme-playground.md
  - title: Tags
    path: tags.md
  - title: Blog
    children:
      - path: blog/index.md
  - title: Shannon Paper
    children:
      - path: shannon-paper/index.md
      - title: Part I — Discrete Noiseless
        children:
          - path: shannon-paper/part-i/01-discrete-noiseless-channel.md
