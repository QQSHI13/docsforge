site_name: DocsForge Demo
site_url: https://docsforge-demo.pages.dev/
site_description: Documentation for DocsForge Demo
site_author: QQ

theme:
  name: material
  custom_dir: overrides
  favicon: images/favicon.png
  logo: images/docsforge.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  # Declaring `features:` REPLACES the theme defaults rather than extending
  # them, so this list is the full set: the defaults we want to keep, plus the
  # opt-in extras the demo exists to show off.
  features:
    # --- theme defaults we keep ---------------------------------------
    - announce.dismiss        # close button on the announcement bar
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    # --- opt-in extras (off by default) -------------------------------
    - content.tabs.link          # demo has === "Python" tabs: sync them
    - content.footnote.tooltips  # demo has [^1] footnotes: hover previews
    - content.code.select        # select individual code lines
    - navigation.path            # breadcrumbs above the article
    - navigation.instant.prefetch  # prefetch pages on hover/viewport

# Announcement bar, configured rather than overridden. A plain string works too:
#   announce: DocsForge Demo — the official example site
# Reach for `{% block announce %}` only when you need markup this can't express.
announce:
  text: DocsForge Demo —
  link: https://qqshi13.github.io/docsforge/
  link_text: the official example site
  icon: material/rocket-launch

repo_url: https://github.com/QQSHI13/docsforge
repo_name: QQSHI13/docsforge
edit_uri: edit/main/examples/sites/docsforge-demo/docs/

# All 8 core plugins (search, tags, blog, meta, info, minify, privacy, i18n)
# load automatically — no need to declare them under `plugins:`.
# social is opt-in: it needs pillow + cairosvg.
plugins:
  - social

# No nav: key — the demo exercises auto-generated navigation
# (titles from frontmatter/H1/filenames, sections from directories).
# The docs site keeps explicit nav: this is the A/B comparison.
