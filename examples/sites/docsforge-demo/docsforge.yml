          - path: shannon-paper/part-i/05-ergodic-mixed-sources.md
          - path: shannon-paper/part-i/06-choice-uncertainty-entropy.md
          - path: shannon-paper/part-i/07-entropy-of-source.md
          - path: shannon-paper/part-i/08-encoding-decoding.md
          - path: shannon-paper/part-i/09-fundamental-theorem-noiseless.md
          - path: shannon-paper/part-i/10-discussion-examples.md
