site_name: DocsForge Demo
site_url: https://qqshi13.github.io/docsforge-demo/
repo_url: https://github.com/QQSHI13/docsforge

# DocsForge auto-registers Material plugins — no plugins: list needed!

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/QQSHI13/docsforge

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Features: features.md
  - About: about.md
