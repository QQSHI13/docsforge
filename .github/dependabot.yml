version: 2
updates:
  # GitHub Actions used by every workflow (ci, frontend, pages, release).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Frontend build dependencies (pnpm workspace under packages/docsforge).
  - package-ecosystem: "npm"
    directory: "/packages/docsforge"
    schedule:
      interval: "weekly"

  # VS Code extension dependencies.
  - package-ecosystem: "npm"
    directory: "/packages/vscode-docsforge"
    schedule:
      interval: "weekly"

  # Python package dependencies (pyproject.toml).
  - package-ecosystem: "pip"
    directory: "/packages/docsforge"
    schedule:
      interval: "weekly"
