version: 2
updates:
  # GitHub Actions used by every workflow (ci, frontend, pages, release).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Frontend build dependencies (pnpm workspace at the repo root).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # VS Code extension dependencies.
  - package-ecosystem: "npm"
    directory: "/studio"
    schedule:
      interval: "weekly"

  # Python package dependencies (pyproject.toml at the repo root).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
