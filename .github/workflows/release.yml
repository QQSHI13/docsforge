name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Base version (e.g. 11.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Pre-release suffix: b1, rc1, etc. Leave empty for stable.'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate and derive versions
        id: versions
        run: |
          BASE="${{ github.event.inputs.version }}"
          PRE="${{ github.event.inputs.prerelease }}"

          if ! echo "$BASE" | grep -Pq '^\d+\.\d+\.\d+$'; then
            echo "ERROR: Base version must be X.Y.Z (e.g. 11.0.0)"
            exit 1
          fi

          if [ -z "$PRE" ]; then
            echo "pypi=$BASE" >> $GITHUB_OUTPUT
            echo "vsix=$BASE" >> $GITHUB_OUTPUT
            echo "tag=v$BASE" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            # Python PEP 440: 11.0.0b1
            # VSIX semver: 11.0.0-beta.1  (b → beta, rc → rc, a → alpha)
            VSIX_SUFFIX=$(echo "$PRE" | sed 's/^b/-beta./' | sed 's/^rc/-rc./' | sed 's/^a/-alpha./')
            echo "pypi=$BASE$PRE" >> $GITHUB_OUTPUT
            echo "vsix=$BASE$VSIX_SUFFIX" >> $GITHUB_OUTPUT
            echo "tag=v$BASE$PRE" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Bump version in main code
        run: |
          VERSION="${{ steps.versions.outputs.pypi }}"
          FILE="packages/docsforge/docsforge/__init__.py"
          sed -i "s/^__version__ = .*/__version__ = \"$VERSION\"/" "$FILE"
          echo "Updated $FILE: $(grep __version__ $FILE)"

      - name: Bump version in VS Code extension
        run: |
          VERSION="${{ steps.versions.outputs.vsix }}"
          FILE="packages/vscode-docsforge/package.json"
          node -e "
            const pkg = require('./$FILE');
            pkg.version = '$VERSION';
            require('fs').writeFileSync('$FILE', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Updated $FILE: version=$(node -e "console.log(require('./$FILE').version)")"

      - name: Commit and tag
        run: |
          VERSION="${{ steps.versions.outputs.pypi }}"
          TAG="${{ steps.versions.outputs.tag }}"
          git config user.name "docsforge-bot"
          git config user.email "bot@docsforge.dev"
          git add packages/docsforge/docsforge/__init__.py packages/vscode-docsforge/package.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to $VERSION"
            git tag "$TAG"
            git push origin main --tags
          else
            echo "Version already at $VERSION — creating tag only"
            git tag "$TAG" 2>/dev/null || echo "Tag $TAG already exists"
            git push origin --tags
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.versions.outputs.tag }}"
          FLAGS=(
            --title "$TAG"
            --generate-notes
            --target main
          )
          if [ "${{ steps.versions.outputs.prerelease }}" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" "${FLAGS[@]}" || echo "Release $TAG already exists"

      # ── VSIX bundle ──

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install extension dependencies
        run: cd packages/vscode-docsforge && npm install

      - name: Compile extension
        run: cd packages/vscode-docsforge && npm run compile

      - name: Lint extension
        run: cd packages/vscode-docsforge && npm run lint || true

      - name: Package extension
        run: |
          cd packages/vscode-docsforge
          npm install -g @vscode/vsce
          vsix_version="${{ steps.versions.outputs.vsix }}"
          vsce package --out "docsforge-vscode-${vsix_version}.vsix"

      - name: Attach VSIX to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VSIX_VERSION="${{ steps.versions.outputs.vsix }}"
          TAG="${{ steps.versions.outputs.tag }}"
          gh release upload "$TAG" \
            "packages/vscode-docsforge/docsforge-vscode-${VSIX_VERSION}.vsix" \
            --clobber

  publish-pypi:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/docsforge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build deps
        run: pip install build

      - name: Build Python package
        run: cd packages/docsforge && python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verify-metadata: false
          packages-dir: packages/docsforge/dist/
