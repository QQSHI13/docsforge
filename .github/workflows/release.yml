name: Release


on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Base version (e.g. 11.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Pre-release suffix: b1, rc1, etc. Leave empty for stable.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install DocsForge + test deps + Playwright
        run: |
          pip install -e packages/docsforge
          pip install pytest pytest-mock playwright
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Run all tests
        run: cd packages/docsforge && python -m pytest -q

  release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      version: ${{ steps.versions.outputs.version }}
      major: ${{ steps.versions.outputs.major }}
      major_minor: ${{ steps.versions.outputs.major_minor }}
      vsix_version: ${{ steps.versions.outputs.vsix }}
      tag: ${{ steps.versions.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate and derive versions
        id: versions
        run: |
          BASE="${{ github.event.inputs.version }}"
          PRE="${{ github.event.inputs.prerelease }}"

          if ! echo "$BASE" | grep -Pq '^\d+\.\d+\.\d+$'; then
            echo "ERROR: Base version must be X.Y.Z (e.g. 11.0.0)"
            exit 1
          fi

          if [ -n "$PRE" ] && ! echo "$PRE" | grep -Pq '^(a|b|rc)[0-9]+$'; then
            echo "ERROR: Prerelease suffix must match ^(a|b|rc)[0-9]+$ (e.g. b1, rc1)"
            exit 1
          fi

          if [ -z "$PRE" ]; then
            echo "pypi=$BASE" >> $GITHUB_OUTPUT
            echo "vsix=$BASE" >> $GITHUB_OUTPUT
            echo "version=$BASE" >> $GITHUB_OUTPUT
            echo "major=$(echo $BASE | cut -d. -f1)" >> $GITHUB_OUTPUT
            echo "major_minor=$(echo $BASE | cut -d. -f1-2)" >> $GITHUB_OUTPUT
            echo "tag=v$BASE" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            # Python PEP 440: 11.0.0b1
            # VSIX semver: 11.0.0-beta.1  (b -> beta, rc -> rc, a -> alpha)
            VSIX_SUFFIX=$(echo "$PRE" | sed 's/^b/-beta./' | sed 's/^rc/-rc./' | sed 's/^a/-alpha./')
            echo "pypi=$BASE$PRE" >> $GITHUB_OUTPUT
            echo "vsix=$BASE$VSIX_SUFFIX" >> $GITHUB_OUTPUT
            echo "version=$BASE$PRE" >> $GITHUB_OUTPUT
            echo "major=" >> $GITHUB_OUTPUT
            echo "major_minor=" >> $GITHUB_OUTPUT
            echo "tag=v$BASE$PRE" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Bump version in main code
        run: |
          VERSION="${{ steps.versions.outputs.pypi }}"
          FILE="packages/docsforge/docsforge/__init__.py"
          sed -i "s/^__version__ = .*/__version__ = \"$VERSION\"/" "$FILE"
          echo "Updated $FILE: $(grep __version__ $FILE)"

      - name: Bump version in VS Code extension
        run: |
          VERSION="${{ steps.versions.outputs.vsix }}"
          FILE="packages/vscode-docsforge/package.json"
          node -e "
            const pkg = require('./$FILE');
            pkg.version = '$VERSION';
            require('fs').writeFileSync('$FILE', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Updated $FILE: version=$(node -e "console.log(require('./$FILE').version)")"

      - name: Bump version in VS Code extension lockfile
        run: |
          LOCK="packages/vscode-docsforge/package-lock.json"
          if [ -f "$LOCK" ]; then
            node -e "
              const fs = require('fs');
              const lock = JSON.parse(fs.readFileSync('$LOCK'));
              lock.version = '${{ steps.versions.outputs.vsix }}';
              if (lock.packages && lock.packages['']) {
                lock.packages[''].version = '${{ steps.versions.outputs.vsix }}';
              }
              fs.writeFileSync('$LOCK', JSON.stringify(lock, null, 2) + '\n');
            "
            echo "Updated $LOCK: version=$(node -e "console.log(require('./$LOCK').version)")"
          else
            echo "$LOCK not present — npm install will regenerate it"
          fi

      - name: Commit and tag
        id: commit
        run: |
          VERSION="${{ steps.versions.outputs.pypi }}"
          TAG="${{ steps.versions.outputs.tag }}"
          git config user.name "docsforge-bot"
          git config user.email "bot@docsforge.dev"
          git add packages/docsforge/docsforge/__init__.py packages/vscode-docsforge/package.json
          # package-lock.json is gitignored, but if it exists we want it committed
          # so the lockfile version stays in sync with package.json.
          if [ -f packages/vscode-docsforge/package-lock.json ]; then
            git add -f packages/vscode-docsforge/package-lock.json
          fi

          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to $VERSION"
            git tag "$TAG"
            git push origin main --tags
          else
            echo "Version already at $VERSION — creating tag only"
            git tag "$TAG" 2>/dev/null || echo "Tag $TAG already exists"
            git push origin --tags
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ steps.versions.outputs.version }}"
          CHANGELOG="packages/docsforge-docs/docs/changelog/index.md"
          # Extract the "## [VERSION] ..." section up to the next "## [" header.
          # Use index() (string search) instead of a regex so bracket escaping
          # can't differ between awk implementations (mawk vs gawk).
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 {p=1; print; next}
            p && index($0, "## [") == 1 {exit}
            p {print}
          ' "$CHANGELOG" > body.md

          if [ -s body.md ]; then
            # Use printf with single-quoted formats so backticks/code-fences
            # are literal (no command substitution or escaping pitfalls).
            {
              printf '## DocsForge %s\n\n' "$VERSION"
              printf 'Drop-in replacement for MkDocs + Material for MkDocs. One package, one command, zero CDN calls.\n\n'
              cat body.md
              printf '\n---\n\n### Install / upgrade\n\n'
              printf '```\npip install --upgrade docsforge==%s\n```\n\n' "$VERSION"
              printf '### Docker\n\n'
              printf '```\ndocker pull ghcr.io/qqshi13/docsforge:%s\n' "$VERSION"
              printf 'docker run --rm -v "$(pwd):/docs" ghcr.io/qqshi13/docsforge:%s build\n```\n\n' "$VERSION"
              printf '### VS Code extension\n\n'
              printf 'Download the `docsforge-vscode-%s.vsix` asset attached below.\n\n' "$VERSION"
              printf 'Docs: https://qqshi13.github.io/docsforge/  -  Issues: https://github.com/QQSHI13/docsforge/issues\n'
            } > release-notes.md
            echo "notes_file=release-notes.md" >> $GITHUB_OUTPUT
            echo "Extracted changelog entry for $VERSION."
          else
            echo "notes_file=" >> $GITHUB_OUTPUT
            echo "No changelog entry for $VERSION — will fall back to auto-generated notes"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.versions.outputs.tag }}"
          NOTES_FILE="${{ steps.notes.outputs.notes_file }}"
          FLAGS=(--title "$TAG" --target main)
          if [ -n "$NOTES_FILE" ]; then
            FLAGS+=(--notes-file "$NOTES_FILE")
          else
            FLAGS+=(--generate-notes)
          fi
          if [ "${{ steps.versions.outputs.prerelease }}" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" "${FLAGS[@]}" || echo "Release $TAG already exists"

  build-vsix:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.commit_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install extension dependencies
        run: cd packages/vscode-docsforge && npm install

      - name: Compile extension
        run: cd packages/vscode-docsforge && npm run compile

      - name: Lint extension
        run: cd packages/vscode-docsforge && npm run lint

      - name: Test extension
        run: cd packages/vscode-docsforge && npm test

      - name: Package extension
        run: |
          cd packages/vscode-docsforge
          npm install -g @vscode/vsce
          vsce package --out "docsforge-vscode-${{ needs.release.outputs.vsix_version }}.vsix"

      - name: Generate VSIX checksum
        run: |
          cd packages/vscode-docsforge
          sha256sum "docsforge-vscode-${{ needs.release.outputs.vsix_version }}.vsix" \
            > "docsforge-vscode-${{ needs.release.outputs.vsix_version }}.vsix.sha256"

      - name: Attach VSIX and checksum to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VSIX_VERSION="${{ needs.release.outputs.vsix_version }}"
          TAG="${{ needs.release.outputs.tag }}"
          gh release upload "$TAG" \
            "packages/vscode-docsforge/docsforge-vscode-${VSIX_VERSION}.vsix" \
            "packages/vscode-docsforge/docsforge-vscode-${VSIX_VERSION}.vsix.sha256" \
            --clobber

  build-docker:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.commit_sha }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # The job checks out the commit SHA (not the tag), so `type=semver`
          # never fires. Emit explicit version tags from the release outputs.
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=${{ needs.release.outputs.major_minor }},enable=${{ needs.release.outputs.major_minor != '' }}
            type=raw,value=${{ needs.release.outputs.major }},enable=${{ needs.release.outputs.major != '' }}
            type=sha,format=short
          flavor: |
            latest=${{ needs.release.outputs.prerelease != 'true' }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-pypi:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/docsforge
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.commit_sha }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python build deps
        run: pip install build

      - name: Build Python package
        run: cd packages/docsforge && python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          packages-dir: packages/docsforge/dist/
