name: Bench

# Engine benchmarks run only on demand or on a schedule: a shared GitHub runner
# is noisy, so these numbers are for regression spotting, not marketing claims.
# Everything runs sequentially (no matrix, no parallel jobs) so timings are not
# distorted by another job stealing the CPU.
on:
  workflow_dispatch:
    inputs:
      pages:
        description: 'Page count for the medium site'
        required: false
        default: '200'
      reps:
        description: 'Repetitions per scenario'
        required: false
        default: '3'
      engine:
        description: 'Which engine(s) to benchmark'
        type: choice
        options: [both, docsforge, mkdocs]
        default: both
  schedule:
    # Weekly, Monday 04:00 UTC.
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Show runner facts
        run: |
          echo "--- cpu ---"
          lscpu | sed -n '1,20p'
          echo "--- memory ---"
          free -m
          echo "--- os ---"
          uname -a

      - name: Install DocsForge (editable) + benchmark deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install mkdocs mkdocs-material
          pip freeze

      - name: Verify both engines import
        run: |
          python - <<'PY'
          import docsforge, mkdocs, material, pymdownx, markdown
          print("docsforge", docsforge.__version__)
          print("mkdocs", mkdocs.__version__)
          print("material", material.__version__)
          print("pymdownx", pymdownx.__version__)
          print("markdown", markdown.__version__)
          PY

      - name: Deterministic input check
        # Both engines must see identical Markdown; regenerate twice and diff.
        run: |
          python bench/gen_site.py --root /tmp/gen-a --pages 20
          python bench/gen_site.py --root /tmp/gen-b --pages 20
          diff -r /tmp/gen-a/docs /tmp/gen-b/docs && echo "generator is deterministic"

      - name: Smoke test (1 rep, small site)
        run: python bench/run_bench.py --quick --quiet --json bench/results-smoke.json

      - name: Full benchmark
        env:
          PAGES: ${{ github.event.inputs.pages || '200' }}
          REPS: ${{ github.event.inputs.reps || '3' }}
          ENGINE: ${{ github.event.inputs.engine || 'both' }}
        run: |
          python bench/run_bench.py \
            --engine "$ENGINE" \
            --pages "$PAGES" \
            --reps "$REPS" \
            --json bench/results.json | tee bench/summary.txt

      - name: Upload results
        uses: actions/upload-artifact@v5
        with:
          name: bench-results
          path: |
            bench/results.json
            bench/results-smoke.json
            bench/summary.txt
          if-no-files-found: error
