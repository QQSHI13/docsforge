name: Demo

# Build the example site in GitHub Actions (Cloudflare Pages' build image
# cannot install TeX Live for TikZ) and deploy the result to Cloudflare
# Pages. Turn OFF the Cloudflare-side auto-build to avoid double deploys.

on:
  push:
    branches: [main]
    paths:
      - 'examples/site/docsforge-demo/**'
      - 'docsforge/**'
      - 'src/**'
      - 'build_frontend.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install TeX Live (TikZ only)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-pictures \
            texlive-latex-extra \
            dvisvgm

      - name: Install DocsForge
        run: pip install .

      - name: Build demo site
        run: docsforge build
        working-directory: examples/site/docsforge-demo

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Run all wrangler commands from the demo dir so paths stay relative.
          workingDirectory: examples/site/docsforge-demo
          # Ensure the Pages project exists (first run on a fresh account).
          # `|| true` swallows the "already exists" error on subsequent runs.
          preCommands: |
            wrangler pages project create docsforge-demo --production-branch=main || true
          # --branch: explicit (detached HEAD in CI confuses git detection);
          # --commit-dirty: the build just wrote site/, so the tree is dirty.
          command: >-
            pages deploy site
            --project-name=docsforge-demo
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-dirty=true
