name: Frontend

# Builds the frontend from src/ into the committed templates and runs the
# Python test suite, so a frontend change can't land broken on main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build frontend
        run: python build_frontend.py
        working-directory: .

      - name: Verify committed templates match the build
        run: git diff --exit-code -- docsforge/templates

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install DocsForge (editable) + test deps
        run: |
          pip install -e .
          pip install pytest pytest-mock

      - name: Run tests
        run: python -m pytest tests/unit tests/regression tests/integration -q
        working-directory: .
