name: Bundle VS Code Extension

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install extension dependencies
        run: cd packages/vscode-docsforge && npm install

      - name: Compile extension
        run: cd packages/vscode-docsforge && npm run compile

      - name: Lint extension
        run: cd packages/vscode-docsforge && npm run lint || true

      - name: Package extension
        run: |
          cd packages/vscode-docsforge
          npm install -g @vscode/vsce
          vsce package --out docsforge-vscode.vsix

      - name: Attach to release
        uses: softprops/action-gh-release@v1
        with:
          files: packages/vscode-docsforge/docsforge-vscode.vsix
