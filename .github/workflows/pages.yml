name: Deploy Docs to GitHub Pages


on:
  push:
    branches: [main]
    paths:
      - 'docsforge-docs/**'
      - 'docsforge/**'
      - 'src/**'
      - 'build_frontend.py'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install DocsForge
        run: pip install .

      - name: Build site
        run: cd docsforge-docs && docsforge build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docsforge-docs/site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
