name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install DocsForge (editable) + test deps
        run: |
          pip install -e packages/docsforge
          pip install pytest pytest-mock
      - name: Run tests
        run: cd packages/docsforge && python -m pytest tests/unit tests/regression tests/integration -q
