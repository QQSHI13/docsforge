name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DocsForge
        run: pip install ./packages/docsforge

      - name: Test CLI --version
        run: docsforge --version

      - name: Test build docs site
        run: cd packages/docsforge-docs && docsforge build

      - name: Test CLI --help
        run: docsforge --help

      - name: Test build subcommand help
        run: docsforge build --help

  test-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install extension dependencies
        run: cd packages/vscode-docsforge && npm install

      - name: Compile extension
        run: cd packages/vscode-docsforge && npm run compile

      - name: Lint extension
        run: cd packages/vscode-docsforge && npm run lint || true

      - name: Package extension
        if: github.event_name == 'release'
        run: |
          cd packages/vscode-docsforge
          npm install -g @vscode/vsce
          vsce package --out docsforge-vscode.vsix

      - name: Upload extension artifact
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: docsforge-vscode
          path: packages/vscode-docsforge/docsforge-vscode.vsix

  release-extension:
    runs-on: ubuntu-latest
    needs: test-extension
    if: github.event_name == 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: docsforge-vscode
          path: ./packages/vscode-docsforge

      - name: Attach to release
        uses: softprops/action-gh-release@v1
        with:
          files: packages/vscode-docsforge/docsforge-vscode.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
