name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Ruff runs as a correctness and style gate (pyflakes + bugbear + pylint
  # errors, plus pycodestyle, isort, pep8-naming and friends) — see the
  # rationale in [tool.ruff.lint] in pyproject.toml. Pinned so a new ruff
  # release can't turn main red without a deliberate bump.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install 'ruff==0.16.4'
      - name: Lint
        run: ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install DocsForge (editable) + test deps
        run: |
          pip install -e .
          pip install pytest pytest-mock
      - name: Run tests
        run: python -m pytest tests/unit tests/regression tests/integration -q

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install DocsForge (editable) + test deps + Playwright
        run: |
          pip install -e .
          pip install pytest pytest-mock playwright
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Run E2E browser tests
        run: python -m pytest -m e2e -q

  # Builds the frontend from src/ into the committed templates and verifies
  # the committed output matches, so a frontend change can't land broken on
  # main. (Formerly .github/workflows/frontend.yml.)
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install DocsForge (pygments for pygments.css generation)
        # setup-python puts us on a toolcache Python whose site-packages is
        # writable, so pip resolves pygments>=2.20.0 from pyproject.toml to the
        # current release and installs it there, shadowing the runner image's
        # system pygments (2.17.2 — its HtmlFormatter emits #FF0000 for .err,
        # the current one emits #F00). Without setup-python, pip installs into
        # the user site but the system dist-packages copy still wins on import.
        run: pip install -e .

      - name: Build frontend
        run: python build_frontend.py

      - name: Verify committed templates match the build
        # Two separate failure modes, so two separate checks:
        #
        # 1. `git diff --exit-code` catches modified and deleted files, but is
        #    blind to NEW ones. A dependency that *adds* assets (e.g. a
        #    lucide-static bump shipping 9 new icons) would leave them
        #    untracked and still pass, silently committing a version bump whose
        #    entire payload is missing from the tree.
        # 2. Untracked output is checked with `git status --porcelain`, which
        #    reports `??` entries. `--untracked-files=all` lists individual
        #    files rather than collapsing them into a directory name, so the
        #    error message names exactly what to `git add`.
        run: |
          git diff --exit-code -- docsforge/templates
          untracked="$(git status --porcelain --untracked-files=all -- docsforge/templates)"
          if [ -n "$untracked" ]; then
            echo "::error::build_frontend.py produced files that are not committed."
            echo "Run 'python build_frontend.py' and 'git add docsforge/templates'."
            echo "$untracked"
            exit 1
          fi

  # The VS Code extension has its own npm workspace; a PR can break its
  # install (e.g. an incompatible toolchain peer range) without touching any
  # Python or root-workspace file. Compile + lint + test it here so
  # dependabot PRs against /studio are actually validated.
  studio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7

      - name: Install studio deps
        run: npm ci
        working-directory: studio

      - name: Compile
        run: npm run compile
        working-directory: studio

      - name: Lint
        run: npm run lint
        working-directory: studio

      - name: Test
        run: npm test
        working-directory: studio

      # `vsce package` enforces constraints that compile/lint/test do not --
      # notably that @types/vscode never exceeds engines.vscode. Without this
      # step a dependabot typings bump goes green here and only fails in
      # release.yml's build-vsix job, which runs AFTER the tag and the PyPI
      # publish, leaving a published release with no .vsix attached.
      - name: Verify the extension can be packaged
        run: |
          npx --yes @vscode/vsce package --out /tmp/ci-check.vsix
          rm -f /tmp/ci-check.vsix
        working-directory: studio
