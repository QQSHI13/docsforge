name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install DocsForge (editable) + test deps
        run: |
          pip install -e .
          pip install pytest pytest-mock
      - name: Run tests
        run: python -m pytest tests/unit tests/regression tests/integration -q

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install DocsForge (editable) + test deps + Playwright
        run: |
          pip install -e .
          pip install pytest pytest-mock playwright
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Run E2E browser tests
        run: python -m pytest -m e2e -q

  # Builds the frontend from src/ into the committed templates and verifies
  # the committed output matches, so a frontend change can't land broken on
  # main. (Formerly .github/workflows/frontend.yml.)
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Install pygments (for pygments.css generation)
        # Pin the exact version: GitHub's runner ships pygments 2.17.2
        # system-wide (emits #FF0000), but the committed file is generated
        # with 2.19.2 (emits #F00). Without the pin the parity check would
        # fail against the runner's preinstalled version.
        run: pip install --user pygments==2.19.2

      - name: Build frontend
        run: python build_frontend.py

      - name: Verify committed templates match the build
        run: git diff --exit-code -- docsforge/templates

  # The VS Code extension has its own npm workspace; a PR can break its
  # install (e.g. an incompatible toolchain peer range) without touching any
  # Python or root-workspace file. Compile + lint + test it here so
  # dependabot PRs against /studio are actually validated.
  studio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7

      - name: Install studio deps
        run: npm ci
        working-directory: studio

      - name: Compile
        run: npm run compile
        working-directory: studio

      - name: Lint
        run: npm run lint
        working-directory: studio

      - name: Test
        run: npm test
        working-directory: studio
